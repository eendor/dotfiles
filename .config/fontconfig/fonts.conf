<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>SF Pro</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>SF Pro</family></prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer><family>SF Pro</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>SF Mono</family>
      <family>FantasqueSansM Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>SF Pro</family></prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer><family>SF Pro</family></prefer>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer><family>SF Pro</family></prefer>
  </alias>
</fontconfig>
